name: fundmf
description: "Fundmf - Mutual fund portfolio tracking for admin-provisioned investors."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # Material Design 3 widget library (Flutter >= 3.47).
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

  # State management.
  flutter_riverpod: ^3.5.0

  # Firebase platform services.
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

  # Charts, formatting, networking and reporting.
  fl_chart: ^1.3.1
  intl: ^0.20.3
  http: ^1.6.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  cross_file: ^0.3.5
  path_provider: ^2.1.6
  url_launcher: ^6.3.3

  # Browser APIs for the Flutter web build (used to download PDF/CSV reports).
  web: ^1.1.2
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
