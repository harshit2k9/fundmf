# Fundmf backend on Render.
#
#   Web service : Express API - admin manual sync endpoint (POST /api/cams/sync)
#   Cron job    : the same pipeline, once a day at 09:00 Asia/Kolkata (IST)
#
# Firebase Authentication and Firestore are unchanged; only compute moved here.
# Secrets are marked `sync: false` so they are filled in the Render dashboard and
# never committed to the repo.

services:
  - type: web
    # Served at https://fundmf.onrender.com — keep the name in sync with the
    # URL baked into AppConstants.apiBaseUrl and the README.
    name: fundmf
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: fundmfservices@gmail.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Password of the CAMS statement zip. Set it in the Render dashboard to
      # rotate; the code default (Fund@123) is used when unset.
      - key: CAMS_ZIP_PASSWORD
        sync: false

  - type: cron
    name: fundmf-cams-sync
    runtime: node
    plan: starter
    rootDir: server
    # Render cron schedules are UTC. 03:30 UTC = 09:00 Asia/Kolkata (IST),
    # one regular sync every 24 hours.
    schedule: "30 3 * * *"
    buildCommand: npm install && npm run build
    startCommand: npm run sync
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: ADMIN_EMAIL
        value: fundmfservices@gmail.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Password of the CAMS statement zip. Set it in the Render dashboard to
      # rotate; the code default (Fund@123) is used when unset.
      - key: CAMS_ZIP_PASSWORD
        sync: false
