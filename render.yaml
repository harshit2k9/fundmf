# Fundmf backend on Render.
#
#   Web service : Express API - admin manual sync endpoint (POST /api/cams/sync)
#   Cron job    : the same pipeline, every 6 hours (replaces the Cloud Scheduler)
#
# Firebase Authentication and Firestore are unchanged; only compute moved here.
# Secrets are marked `sync: false` so they are filled in the Render dashboard and
# never committed to the repo.

services:
  - type: web
    name: fundmf-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: fundmfservices@gmail.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false

  - type: cron
    name: fundmf-cams-sync
    runtime: node
    plan: starter
    rootDir: server
    # UTC. Every 6 hours at 00:00 / 06:00 / 12:00 / 18:00 UTC
    # (05:30 / 11:30 / 17:30 / 23:30 Asia/Kolkata).
    schedule: "0 */6 * * *"
    buildCommand: npm install && npm run build
    startCommand: npm run sync
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: ADMIN_EMAIL
        value: fundmfservices@gmail.com
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
